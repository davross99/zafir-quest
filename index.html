<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Jack, Jia & Zafir's Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16232E;
    --navy-deep:#0E1922;
    --gold:#D4A24C;
    --gold-bright:#E8C275;
    --lavender:#9B7FBD;
    --cream:#F3EDE0;
    --cream-dim:#C9C2B2;
    --ok:#7BA876;
    --bad:#D9694A;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse at top, #223447 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color:var(--cream);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:640px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---- Title screen ---- */
  #title-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px 24px;
    gap:18px;
  }
  #title-screen .genie-mark{
    width:180px;
    max-width:60vw;
    height:auto;
    filter:drop-shadow(0 0 18px rgba(212,162,76,0.45));
  }
  #title-screen h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:clamp(28px,7vw,42px);
    line-height:1.05;
    margin:0;
    color:var(--gold-bright);
  }
  #title-screen p.sub{
    font-size:15px;
    color:var(--cream-dim);
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin:0;
  }
  #title-screen .route{
    font-size:22px;
    letter-spacing:0.12em;
    opacity:0.85;
    margin-top:6px;
  }
  button.primary{
    margin-top:14px;
    background:linear-gradient(135deg,var(--gold) 0%, var(--gold-bright) 100%);
    color:var(--navy-deep);
    border:none;
    font-family:'Nunito',sans-serif;
    font-weight:800;
    font-size:17px;
    padding:14px 34px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(212,162,76,0.35);
  }
  button.primary:active{transform:translateY(1px);}

  /* ---- Progress trail ---- */
  #trail{
    display:flex;
    gap:6px;
    padding:12px 16px;
    overflow-x:auto;
    background:rgba(0,0,0,0.18);
    border-bottom:1px solid rgba(255,255,255,0.06);
    scrollbar-width:none;
  }
  #trail::-webkit-scrollbar{display:none;}
  .flag-dot{
    flex:0 0 auto;
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,255,255,0.12);
    opacity:0.4;
    transition:opacity .3s, transform .3s, box-shadow .3s;
  }
  .flag-dot.done{
    opacity:1;
    border-color:var(--gold);
    box-shadow:0 0 10px rgba(212,162,76,0.5);
  }
  .flag-dot.active{
    opacity:1;
    transform:scale(1.15);
    border-color:var(--gold-bright);
  }

  /* ---- Chapter view ---- */
  #chapter-view{
    flex:1;
    padding:20px 20px 100px;
  }
  #chapter-view h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    color:var(--gold-bright);
    margin:0 0 4px;
  }
  #chapter-view .ch-num{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--lavender);
    opacity:0.9;
  }
  .story-block{
    font-size:16.5px;
    line-height:1.65;
    margin:14px 0;
  }
  .story-block em{color:var(--cream-dim);font-style:italic;}
  .story-block strong{color:var(--gold-bright);}
  .story-block.dialogue{color:var(--cream);}

  .gap-line{
    font-size:16.5px;
    line-height:1.7;
    margin:16px 0 6px;
  }
  .gap-blank{
    display:inline-block;
    min-width:110px;
    text-align:center;
    padding:2px 10px;
    border-bottom:2px dashed var(--gold);
    color:var(--gold-bright);
    font-weight:700;
  }
  .gap-blank.filled{
    border-bottom-style:solid;
  }
  .options{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:6px 0 18px;
  }
  .opt-btn{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:15px;
    padding:9px 16px;
    border-radius:999px;
    border:1.5px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.04);
    color:var(--cream);
    cursor:pointer;
    transition:all .15s;
  }
  .opt-btn:hover{border-color:var(--gold);}
  .opt-btn.correct{
    background:rgba(123,168,118,0.22);
    border-color:var(--ok);
    color:#DDEBD8;
  }
  .opt-btn.incorrect{
    background:rgba(217,105,74,0.22);
    border-color:var(--bad);
    color:#F5D9CE;
  }
  .opt-btn.disabled{
    pointer-events:none;
    opacity:0.55;
  }
  .opt-btn.disabled.correct, .opt-btn.disabled.incorrect{opacity:1;}

  #chapter-footer{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;justify-content:center;
    pointer-events:none;
  }
  #chapter-footer-inner{
    width:100%;max-width:640px;
    padding:14px 20px 22px;
    background:linear-gradient(to top, var(--navy-deep) 60%, transparent);
    display:flex;justify-content:flex-end;
    pointer-events:auto;
  }
  #continue-btn{display:none;}

  /* ---- Passport stamp ---- */
  #stamp-layer{
    position:fixed;
    inset:0;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    z-index:50;
  }
  .stamp{
    font-size:110px;
    opacity:0;
    transform:scale(2.2) rotate(-12deg);
    filter:drop-shadow(0 0 30px rgba(212,162,76,0.6));
  }
  .stamp.play{
    animation: stampIn 0.6s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{opacity:0; transform:scale(2.6) rotate(-18deg);}
    55%{opacity:1; transform:scale(0.92) rotate(-8deg);}
    75%{transform:scale(1.05) rotate(-10deg);}
    100%{opacity:0; transform:scale(1) rotate(-10deg); transition-delay:.4s;}
  }

  /* ---- Score screen ---- */
  #score-screen{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:32px 24px;
    gap:10px;
  }
  #score-screen .rank-emoji{font-size:52px;}
  #score-screen h1{
    font-family:'Fraunces',serif;
    color:var(--gold-bright);
    font-size:30px;
    margin:6px 0 0;
  }
  #score-screen .scoreline{
    font-size:17px;
    color:var(--cream-dim);
  }
  #score-screen .flags-earned{
    font-size:26px;
    letter-spacing:2px;
    margin:14px 0;
  }

  .hidden{display:none !important;}
</style>
</head>

<script>
const GAME_DATA = [{"num": 1, "title": "THE BOTTLE 🏖️", "blocks": [{"type": "text", "text": "*A quiet beach. Late afternoon.*\n\nJack and Jia were walking along the beach when Jia suddenly stopped.\n\n\"Jack.\"\n\n\"What?\"\n\n\"Look.\"\n\nShe was pointing at a dark green bottle, half buried in the sand.\n\nJack walked over and picked it up. Something inside it was moving, and a faint light flickered."}, {"type": "gap", "num": 1, "sentence": "\"There's a light ▁▁▁▁▁▁ the glass,\" said Jack.", "options": ["behind", "above", "between"], "answer": 0}, {"type": "text", "text": "\"Open it!\"\n\n\"Are you sure?\"\n\n\"No.\"\n\nJack laughed and pulled out the cork anyway.\n\nNothing happened.\n\nThey waited.\n\nStill nothing.\n\nThen—\n\nWHOOSH!\n\nBlue smoke exploded out of the bottle and Jia jumped back.\n\nThe smoke rushed upward and began to spin. Out of it came a small, round creature with greyish-purple fur, black rounded ears, gold hoops in his ears, a little cap with a single blue feather tilted over one eye, and a richly patterned purple-and-gold robe.\n\nWhere his legs should have been, there was only a swirl of golden smoke."}, {"type": "gap", "num": 2, "sentence": "He floated ▁▁▁▁▁▁ them, arms wide, beaming down with the widest smile Jack had ever seen.", "options": ["above", "behind", "below"], "answer": 0}, {"type": "text", "text": "\"Finally!\" he shouted.\n\nJack stared.\n\nJia stared.\n\n\"Well?\"\n\n\"Well what?\" asked Jack.\n\n\"Say something!\"\n\n\"You're a genie,\" said Jia.\n\n\"Correct! My name is Zafir.\""}, {"type": "gap", "num": 3, "sentence": "He drifted down until he was floating ▁▁▁▁▁▁ the rock beside them, close enough that his robe brushed the stone.", "options": ["next to", "above", "behind"], "answer": 0}, {"type": "text", "text": "\"And you were in that bottle?\" asked Jack.\n\n\"For about a thousand years.\"\n\n\"That's a long holiday,\" said Jack.\n\nZafir's smile faded.\n\n\"Someone put me there. To get out, I need to break a spell. There are twelve magic boxes, scattered across twelve countries. Bring them together, and the spell breaks.\"\n\n\"That sounds like an adventure,\" said Jia.\n\nZafir clicked his fingers, and a beautiful carpet appeared on the sand."}, {"type": "gap", "num": 4, "sentence": "It landed ▁▁▁▁▁▁ the rock, with the rock directly beside it.", "options": ["next to", "behind", "above"], "answer": 0}, {"type": "text", "text": "\"You're joking,\" said Jack.\n\n\"Does it really fly?\"\n\n\"There's only one way to find out.\"\n\nThey climbed on, and the carpet rose into the air."}, {"type": "gap", "num": 5, "sentence": "The beach dropped farther and farther ▁▁▁▁▁▁ them.", "options": ["below", "above", "behind"], "answer": 0}, {"type": "gap", "num": 6, "sentence": "Zafir flew ahead of them. He was clearly ▁▁▁▁▁▁ the carpet, leading the way through the clouds.", "options": ["in front of", "behind", "under"], "answer": 0}, {"type": "gap", "num": 7, "sentence": "Jia sat down ▁▁▁▁▁▁ Jack, gripping his arm.", "options": ["next to", "between", "behind"], "answer": 0}, {"type": "text", "text": "\"Where are we going?\" Jack called.\n\n\"China!\"\n\n\"Why China?\"\n\n\"Because that's where our first adventure begins!\"\n\nJia looked at Jack.\n\n\"Here we go.\""}]}, {"num": 2, "title": "THE TEAHOUSE 🇨🇳", "blocks": [{"type": "text", "text": "*Beijing.*\n\nThe carpet dropped quietly into a street, and Zafir led them through a doorway into a warm little teahouse.\n\n\"Let's get something to eat,\" said Jack.\n\n\"We just ate.\"\n\n\"I'm hungry again.\""}, {"type": "gap", "num": 8, "sentence": "They found a table ▁▁▁▁▁▁ the window, with only a short space between the table and the window.", "options": ["next to", "behind", "above"], "answer": 0}, {"type": "text", "text": "Zafir suddenly went still.\n\n\"Wait. Did you see that?\"\n\n\"See what?\"\n\nHe pointed."}, {"type": "gap", "num": 9, "sentence": "A small yellow box was sitting ▁▁▁▁▁▁ the teapot, touching its handle.", "options": ["next to", "above", "behind"], "answer": 0}, {"type": "text", "text": "Jia leaned in for a closer look."}, {"type": "gap", "num": 10, "sentence": "A small key was lying ▁▁▁▁▁▁ the two teacups, wedged in the narrow gap.", "options": ["between", "behind", "above"], "answer": 0}, {"type": "text", "text": "\"Look!\"\n\nJack picked it up, fitted it into the lock, and turned it.\n\nClick.\n\nThe lid opened.\n\nInside was a small golden stone.\n\n\"Don't touch it,\" said Zafir.\n\n\"Why?\"\n\n\"It might be magical.\"\n\n\"That's not a reason.\"\n\n\"It is when I say it.\"\n\nJack reached for it anyway.\n\nThe stone leapt out of the box and shot across the room."}, {"type": "gap", "num": 11, "sentence": "It flew past them and stopped ▁▁▁▁▁▁ Jia, hovering directly between her and Jack.", "options": ["in front of", "behind", "above"], "answer": 0}, {"type": "text", "text": "\"Is it supposed to do that?\"\n\n\"No,\" said Zafir."}, {"type": "gap", "num": 12, "sentence": "The stone shot sideways and vanished ▁▁▁▁▁▁ a folding screen. The screen completely hid it from view.", "options": ["behind", "above", "next to"], "answer": 0}, {"type": "text", "text": "Jia hurried over.\n\n\"Where did it go?\"\n\nShe crouched."}, {"type": "gap", "num": 13, "sentence": "It had rolled ▁▁▁▁▁▁ a low table, with the tabletop directly above it.", "options": ["under", "above", "behind"], "answer": 0}, {"type": "text", "text": "She grabbed it, and it stopped glowing.\n\n\"Is that one of the boxes?\" asked Jia.\n\n\"No. A key. To what, that's the fun part.\"\n\nZafir tucked the yellow box into the pouch on his belt.\n\nOutside, red lanterns lit the street."}, {"type": "gap", "num": 14, "sentence": "They glowed ▁▁▁▁▁▁ the food stalls, with the stalls directly below them.", "options": ["above", "below", "between"], "answer": 0}, {"type": "text", "text": "\"Come on,\" said Jia. \"I want to know what that key opens.\"\n\n\"So do I,\" said Zafir."}]}, {"num": 3, "title": "A NIGHT IN SEVILLE 🇪🇸", "blocks": [{"type": "text", "text": "The carpet swept through the evening sky.\n\nSeville appeared below them, glowing with warm lights.\n\nMusic began to spill out of a small restaurant.\n\n\"That sounds good,\" said Jia.\n\n\"It smells good too,\" said Jack.\n\nA waiter showed them to a table, and a guitarist began to play."}, {"type": "gap", "num": 15, "sentence": "Zafir settled ▁▁▁▁▁▁ Jack and Jia, with Jack on one side and Jia on the other.", "options": ["between", "behind", "above"], "answer": 0}, {"type": "text", "text": "\"This is beautiful,\" he whispered.\n\nWhen the song ended, everyone clapped.\n\nThen Zafir pointed towards the kitchen.\n\n\"That's strange.\"\n\n\"What?\""}, {"type": "gap", "num": 16, "sentence": "\"That blue box, ▁▁▁▁▁▁ the kitchen door.\"", "options": ["next to", "above", "behind"], "answer": 0}, {"type": "text", "text": "Jack opened it.\n\nEmpty—except for a tiny piece of blue glass sitting inside.\n\nHe picked it up.\n\nThe restaurant lights suddenly went out.\n\n\"Did you do that?\" Jia whispered.\n\n\"No,\" said Zafir.\n\nThe lights came back.\n\nThe glass was gone."}, {"type": "gap", "num": 17, "sentence": "Jia looked down and found it ▁▁▁▁▁▁ Jack's shoe, hidden from her view by the shoe itself.", "options": ["behind", "above", "next to"], "answer": 0}, {"type": "text", "text": "Jack picked it up.\n\nIt began to glow, tracing a thin blue line across the floor and out into the street."}, {"type": "gap", "num": 18, "sentence": "They followed it until it stopped ▁▁▁▁▁▁ an old stone fountain, with the fountain only a few steps away.", "options": ["next to", "behind", "above"], "answer": 0}, {"type": "text", "text": "Jia crouched and reached under the rim.\n\n\"There's something here,\" she said."}, {"type": "gap", "num": 19, "sentence": "She pulled out a small blue box sitting ▁▁▁▁▁▁ the fountain's stone lip, on the side facing her.", "options": ["in front of", "behind", "above"], "answer": 0}, {"type": "text", "text": "\"Two,\" said Jia.\n\nZafir looke e words moved faster.\n\nJia laughed.\n\n\"Jack, this is getting difficult!\"\n\n\"Keep going!\"\n\nThey filled another gap.\n\nThen another.\n\nThe golden light grew brighter.\n\nZafir watched them.\n\n\"I think you're nearly there.\"\n\n\"Nearly?\"\n\n\"Very nearly.\"\n\nJack looked at Jia.\n\n\"Ready?\"\n\n\"Ready.\"\n\nThey filled the final gap.\n\nEverything stopped.\n\nFor one second, there was complete silence.\n\nThen—\n\nWHOOM!\n\nGolden light exploded across the beach.\n\nThe twelve boxes opened.\n\nNot with gold. Not with treasure. With words.\n\nThousands of words.\n\nThey flew into the air."}, {"type": "gap", "num": 98, "sentence": "Zafir rose ▁▁▁▁▁▁ the sand, his feet leaving the ground.", "options": ["above", "under", "behind"], "answer": 0}, {"type": "text", "text": "The words formed sentences.\n\nThe sentences formed a song.\n\nAnd the song filled the beach.\n\nZafir laughed.\n\nThen he began to sing.\n\nHis voice moved through twelve languages.\n\nJack and Jia danced in the sand.\n\nWhen the song ended, everything became quiet again.\n\nThe twelve boxes sat empty on the beach.\n\nZafir floated gently back down.\n\nHe looked at Jack and Jia.\n\n\"Thank you.\"\n\n\"You're free?\" asked Jia.\n\n\"I'm free.\"\n\n\"Where will you go?\"\n\nZafir thought about it.\n\n\"Home.\"\n\n\"Where's home?\"\n\n\"Wherever my friends are.\"\n\nJack groaned.\n\n\"That's very cheesy.\"\n\n\"I've been trapped in a bottle for a thousand years. I'm allowed one cheesy line.\"\n\nThey laughed.\n\nThe three friends climbed onto the magic carpet.\n\nThe moon was rising over the water.\n\nThey lifted into the night."}, {"type": "gap", "num": 99, "sentence": "Jack looked down as the beach grew smaller ▁▁▁▁▁▁ them.", "options": ["below", "above", "behind"], "answer": 0}, {"type": "text", "text": "\"Wait.\"\n\n\"What?\"\n\n\"Same time next year?\"\n\nJia smiled.\n\n\"Same time next—\"\n\nShe stopped.\n\nThe sand beneath the carpet's shadow had begun to glow.\n\nA golden light pulsed in a perfect circle far below.\n\n\"Zafir—what's that?\"\n\nBefore he could answer, the circle opened.\n\nJack dropped straight through it.\n\n\"JACK!\"\n\nThe circle closed.\n\nJust sand, stars and the sound of the sea.\n\nZafir's smile was gone.\n\n\"That was a portal.\"\n\n\"Where did it take him?\"\n\nZafir looked at the place where Jack had disappeared.\n\n\"Through time.\"\n\nJia grabbed his arm.\n\n\"Can we get him back?\"\n\nZafir nodded.\n\n\"We have to.\"\n\nA second golden circle began to open.\n\nJia climbed onto the carpet.\n\nZafir took the controls.\n\n\"Ready?\"\n\nShe did not hesitate.\n\n\"Let's go.\"\n\nThe carpet shot towards the portal."}, {"type": "gap", "num": 100, "sentence": "One last golden word drifted ▁▁▁▁▁▁ the empty boxes on the sand below, before it too faded into the dark.", "options": ["above", "behind", "below"], "answer": 0}, {"type": "text", "text": "And just before they disappeared into the golden light, Jia looked back at the beach.\n\nTwelve empty boxes sat quietly in the sand.\n\nThe portal opened wider.\n\nZafir pushed the carpet forward.\n\nAnd they vanished into the light.\n\n**TO BE CONTINUED IN GAME 3:\nJACK, JIA & ZAFIR — LOST IN TIME**"}]}];
</script>
<script>
(function(){
  const COUNTRY_ORDER = GAME_DATA.map(ch => {
    const m = ch.title.match(/(\p{Emoji_Presentation}|\p{Extended_Pictographic})+$/u);
    return m ? m[0].trim() : '📍';
  });

  document.getElementById('route-preview').textContent = COUNTRY_ORDER.join(' ');

  let chapterIndex = 0;
  let score = 0;
  let totalGaps = GAME_DATA.reduce((s,ch)=>s+ch.blocks.filter(b=>b.type==='gap').length,0);
  let chapterGapsRemaining = 0;

  function mdInline(text){
    return text
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>');
  }

  function renderTrail(){
    const trail = document.getElementById('trail');
    trail.innerHTML = '';
    COUNTRY_ORDER.forEach((flag,i)=>{
      const d = document.createElement('div');
      d.className = 'flag-dot' + (i < chapterIndex ? ' done' : '') + (i === chapterIndex ? ' active' : '');
      d.textContent = flag;
      trail.appendChild(d);
    });
  }

  function shuffledOptions(gap){
    const idxs = [0,1,2];
    for(let i=idxs.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [idxs[i],idxs[j]]=[idxs[j],idxs[i]];
    }
    return idxs.map(i => ({text: gap.options[i], isCorrect: i === gap.answer}));
  }

  function renderChapter(){
    const ch = GAME_DATA[chapterIndex];
    const view = document.getElementById('chapter-view');
    view.innerHTML = '';
    renderTrail();

    const h = document.createElement('div');
    h.innerHTML = `<div class="ch-num">Chapter ${ch.num} of ${GAME_DATA.length}</div><h2>${mdInline(ch.title)}</h2>`;
    view.appendChild(h);

    chapterGapsRemaining = ch.blocks.filter(b=>b.type==='gap').length;
    document.getElementById('continue-btn').style.display = 'none';

    ch.blocks.forEach(block=>{
      if(block.type === 'text'){
        const paras = block.text.split(/\n\n+/).filter(p=>p.trim().length);
        paras.forEach(p=>{
          const el = document.createElement('div');
          el.className = 'story-block' + (p.trim().startsWith('"') ? ' dialogue' : '');
          el.innerHTML = mdInline(p.trim());
          view.appendChild(el);
        });
      } else if(block.type === 'gap'){
        const wrap = document.createElement('div');
        wrap.className = 'gap-line';
        wrap.innerHTML = mdInline(block.sentence || '');
        view.appendChild(wrap);

        const opts = shuffledOptions(block);
        const optWrap = document.createElement('div');
        optWrap.className = 'options';
        opts.forEach(o=>{
          const btn = document.createElement('button');
          btn.className = 'opt-btn';
          btn.textContent = o.text;
          btn.addEventListener('click', ()=>{
            if(btn.classList.contains('disabled')) return;
            const siblings = optWrap.querySelectorAll('.opt-btn');
            siblings.forEach(s=>s.classList.add('disabled'));
            if(o.isCorrect){
              btn.classList.add('correct');
              score++;
            } else {
              btn.classList.add('incorrect');
              siblings.forEach(s=>{
                if(s.textContent === block.options[block.answer]) s.classList.add('correct');
              });
            }
            chapterGapsRemaining--;
            if(chapterGapsRemaining <= 0){
              showStamp(COUNTRY_ORDER[chapterIndex]);
              document.getElementById('continue-btn').style.display = 'inline-block';
            }
          });
          optWrap.appendChild(btn);
        });
        view.appendChild(optWrap);
      }
    });
  }

  function showStamp(flag){
    const el = document.getElementById('stamp-el');
    el.textContent = flag;
    el.classList.remove('play');
    void el.offsetWidth;
    el.classList.add('play');
  }

  function nextChapter(){
    if(chapterIndex < GAME_DATA.length - 1){
      chapterIndex++;
      renderChapter();
      document.getElementById('chapter-view').scrollIntoView({behavior:'smooth'});
    } else {
      showScore();
    }
  }

  function gradeFor(pct100){
    if(pct100 === 100) return {emoji:'👑', label:'Perfect Quest!'};
    if(pct100 >= 90) return {emoji:'🔥', label:'Incredible!'};
    if(pct100 >= 78) return {emoji:'🎯', label:'Outstanding!'};
    if(pct100 >= 62) return {emoji:'⭐', label:'Great Explorer!'};
    if(pct100 >= 48) return {emoji:'👍', label:'Good Quest!'};
    return {emoji:'🌱', label:'Keep Searching!'};
  }

  function showScore(){
    document.getElementById('game-screen').classList.add('hidden');
    document.getElementById('chapter-footer').classList.add('hidden');
    const scaled = Math.round((score/totalGaps)*100);
    const g = gradeFor(scaled);
    const s = document.getElementById('score-screen');
    s.classList.remove('hidden');
    s.innerHTML = `
      <div class="rank-emoji">${g.emoji}</div>
      <h1>${g.label}</h1>
      <div class="scoreline">You scored ${score} out of ${totalGaps}</div>
      <div class="flags-earned">${COUNTRY_ORDER.join(' ')}</div>
      <button class="primary" id="replay-btn">Play Again</button>
    `;
    document.getElementById('replay-btn').addEventListener('click', ()=>{
      chapterIndex = 0; score = 0;
      s.classList.add('hidden');
      document.getElementById('title-screen').classList.remove('hidden');
    });
  }

  document.getElementById('start-btn').addEventListener('click', ()=>{
    document.getElementById('title-screen').classList.add('hidden');
    document.getElementById('game-screen').classList.remove('hidden');
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('chapter-footer').classList.remove('hidden');
    renderChapter();
  });

  document.getElementById('continue-btn').addEventListener('click', nextChapter);
})();
</script>
